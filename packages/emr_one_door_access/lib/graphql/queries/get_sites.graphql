query GetSites(
  $after: String
  $before: String
  $first: Int
  $last: Int
) {
  sites(
    after: $after
    before: $before
    first: $first
    last: $last
  ) {
    totalCount 
    pageInfo {
      hasNextPage
      hasPreviousPage
      startCursor
      endCursor
    }
    nodes {
      yardCode
      name
      createdOn
      createdBy
      modifiedOn
      modifiedBy
      active
      id
    }
  }
}
