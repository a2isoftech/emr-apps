query GetSchedules(
  $after: String
  $before: String
  $first: Int
  $last: Int
  $accessControllerId: String!
) {
  schedules(
    after: $after
    before: $before
    first: $first
    last: $last
    accessControllerId: $accessControllerId
  ) {
    totalCount
    pageInfo {
      hasNextPage
      hasPreviousPage
      startCursor
      endCursor
    }
    nodes {
      token
      name
      description
      scheduleDefinition
      attribute {
        type
        name
        value
      }
      exceptionScheduleDefinition
    }
  }
}
