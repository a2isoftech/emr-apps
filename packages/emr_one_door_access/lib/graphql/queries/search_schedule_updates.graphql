query SearchScheduleUpdates(
  $after: String
  $before: String
  $first: Int
  $last: Int
  $input: SearchScheduleUpdateInput!
) {
  searchScheduleUpdates(
    after: $after
    before: $before
    first: $first
    last: $last
    input: $input
  ) {
    totalCount 
    pageInfo{
      hasNextPage
      hasPreviousPage
      startCursor
      endCursor
    }
    nodes {
     rowId
     accessControllerId
     utcTime
     topic2
     siteId
     siteName
     accessControllerName
     scheduleToken     
    }
  }
}
