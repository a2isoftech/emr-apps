query GetAccessCredentials(
  $after: String
  $before: String
  $first: Int
  $last: Int
  $input: SearchAccessCredentialsInput!
) {
  searchAccessCredentials(
    after: $after
    before: $before
    first: $first
    last: $last
    input: $input
  ) {
    pageInfo {
      hasNextPage
      hasPreviousPage
      startCursor
      endCursor
    }
    totalCount
    nodes {
      id
      externalId
      deletedOn
      deletedInDoorControllerOn
      createdInDoorControllerOn
      createdOn
      active
      accessPointId
      modifiedOn
      modifiedBy
      accessPoints {
        id
        name
        restricted
      }
      accessControllers {
        id
        name
      }
      users {
        id
        name
        active
        userName
        azureId
        cardNumber
        externalId
      }
      groups {
        azureId
        active
        name
        id
      }
    }
  }
}
