type Mutation {
  upsertSite(input: UpsertSiteInput!): Site!
    @authorize(policy: "Function:UpsertSite")
  deleteSite(siteId: String!): Boolean!
    @authorize(policy: "Function:DeleteSite")
  restoreSite(siteId: String!): Boolean!
    @authorize(policy: "Function:RestoreSite")
  restrictAccessPoint(accessPointId: String!): Boolean!
    @authorize(policy: "Function:RestrictAccessPoint")
  permitAccessPoint(accessPointId: String!): Boolean!
    @authorize(policy: "Function:PermitAccessPoint")
  deleteAccessController(accessControllerId: String!): Boolean!
    @authorize(policy: "Function:DeleteAccessController")
  syncAccessPoints(accessControllerId: String!): Boolean!
    @authorize(policy: "Function:SyncAccessPoints")
  restoreAccessController(accessControllerId: String!): Boolean!
    @authorize(policy: "Function:RestoreAccessController")
  upsertFullDoorConfiguration(
    upsertDoorConfiguration: UpsertFullDoorConfigurationInput!
  ): Boolean! @authorize(policy: "Function:RestoreAccessController")
  upsertPartialDoorConfiguration(
    upsertDoorConfigurations: [UpsertPartialDoorConfigurationInput!]!
  ): Boolean! @authorize(policy: "Function:RestoreAccessController")
  seedAxisData: Boolean! @authorize(policy: "Function:SeedAxisData")
  createAccessController(input: CreateAccessControllerInput!): Boolean!
    @authorize(policy: "Function:CreateAccessController")
  updateAccessController(
    input: UpdateAccessControllerInput!
  ): AccessController! @authorize(policy: "Function:UpdateAccessController")
  pullNewGroupFromAD(groupId: String!): Boolean!
    @authorize(policy: "Function:PullNewGroupFromAD")
  linkGroupAndAccessPoint(input: CreateGroupAndAccessPointLinkInput!): Boolean!
    @authorize(policy: "Function:LinkGroupAndAccessPoint")
  deLinkGroupAndAccessPoint(input: DelinkGroupAndAccessPointInput!): Boolean!
    @authorize(policy: "Function:DeLinkGroupAndAccessPoint")
  createSchedule(input: CreateScheduleInput!): Boolean!
    @authorize(policy: "Function:CreateSchedule")
  unlockAccessPoint(input: UnlockAccessPointInput!): Boolean!
    @authorize(policy: "Function:UnlockAccessPoint")
  deleteCredential(accessCredentialId: String!): Boolean!
    @authorize(policy: "Function:DeleteCredential")
  restoreCredential(accessCredentialId: String!): Boolean!
    @authorize(policy: "Function:RestoreCredential")
  syncCredential(accessCredentialId: String!): Boolean!
    @authorize(policy: "Function:SyncCredential")
  uploadFloorPlan(file: Upload!): FloorPlanPayload!
  saveFloorPlan(input: UpsertFloorPlanInput!): Boolean!
    @authorize(policy: "Function:SaveFloorPlan")
  deleteFloorPlan(floorPlanId: String!): Boolean!
    @authorize(policy: "Function:DeleteFloorPlan")
  broadcast(
    title: String!
    message: String!
    notificationType: NotificationSeverityEnum!
  ): Boolean! @authorize(policy: "Function:BroadcastNotification")
  addCameraToAccessPoint(input: SaveAccessPointCameraInput!): AccessPoint!
    @authorize(policy: "Function:PermitAccessPoint")
  removeDoorControllerData(accessControllerId: String!): Boolean!
    @authorize(policy: "Function:DeleteAccessController")
  resetBackgroundWorkerSettings: Boolean! @authorize(policy: "Function:")
  sendEmail(request: EmailMessageInput!): Boolean! @authorize
  auditInImmudb: Boolean! @authorize
  performCredentialComparisons: Boolean! @authorize
}

"Information about pagination in a connection."
type PageInfo {
  "Indicates whether more edges exist following the set defined by the clients arguments."
  hasNextPage: Boolean!
  "Indicates whether more edges exist prior the set defined by the clients arguments."
  hasPreviousPage: Boolean!
  "When paginating backwards, the cursor to continue."
  startCursor: String
  "When paginating forwards, the cursor to continue."
  endCursor: String
}

type PriorityAction {
  priorityLevel: String!
  doorAction: String!
}

type Query {
  permmissions(forceRefresh: Boolean!): [String!]! @authorize
  users(
    userIds: [String!]
