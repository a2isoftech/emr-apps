    after: String
    "Returns the last _n_ elements from the list."
    last: Int
    "Returns the elements in the list that come before the specified cursor."
    before: String
    where: ScheduleFilterInput
    order: [ScheduleSortInput!]
  ): SchedulesConnection @authorize(policy: "Function:GetSchedules")
