    "Returns the elements in the list that come after the specified cursor."
    after: String
    "Returns the last _n_ elements from the list."
    last: Int
    "Returns the elements in the list that come before the specified cursor."
    before: String
    where: UserFilterInput
    order: [UserSortInput!]
  ): UsersConnection @authorize(policy: "Function:GetUsers")
  allUsers(userIds: [String!]): [User!]! @authorize(policy: "Function:GetUsers")
  groups(
    groupIds: [String!]
    "Returns the first _n_ elements from the list."
    first: Int
    "Returns the elements in the list that come after the specified cursor."
    after: String
    "Returns the last _n_ elements from the list."
    last: Int
    "Returns the elements in the list that come before the specified cursor."
    before: String
    where: GroupFilterInput
    order: [GroupSortInput!]
  ): GroupsConnection @authorize(policy: "Function:GetGroups")
  allGroups(groupIds: [String!]): [Group!]!
    @authorize(policy: "Function:GetAllGroups")
  sites(
    "Returns the first _n_ elements from the list."
    first: Int
    "Returns the elements in the list that come after the specified cursor."
    after: String
    "Returns the last _n_ elements from the list."
    last: Int
    "Returns the elements in the list that come before the specified cursor."
    before: String
    where: SiteFilterInput
    order: [SiteSortInput!]
  ): SitesConnection @authorize(policy: "Function:GetSites")
  allSites: [Site!]! @authorize(policy: "Function:GetAllSites")
  accessControllers(
    siteId: String
    "Returns the first _n_ elements from the list."
    first: Int
    "Returns the elements in the list that come after the specified cursor."
    after: String
    "Returns the last _n_ elements from the list."
    last: Int
    "Returns the elements in the list that come before the specified cursor."
    before: String
