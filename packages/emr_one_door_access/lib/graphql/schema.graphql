    first: Int
    "Returns the elements in the list that come after the specified cursor."
    after: String
    "Returns the last _n_ elements from the list."
    last: Int
    "Returns the elements in the list that come before the specified cursor."
    before: String
    where: DoorAccessAttemptEventsIndexResultFilterInput
    order: [DoorAccessAttemptEventsIndexResultSortInput!]
  ): SearchDoorAccessAttemptsConnection
    @authorize(policy: "Function:SearchDoorAccessAttempts")
  searchDoorAccessAttemptSnapshots(
    input: SearchDoorAccessAttemptsInput!
    "Returns the first _n_ elements from the list."
    first: Int
    "Returns the elements in the list that come after the specified cursor."
    after: String
    "Returns the last _n_ elements from the list."
    last: Int
    "Returns the elements in the list that come before the specified cursor."
    before: String
    where: DoorAccessAttemptEventsIndexResultFilterInput
    order: [DoorAccessAttemptEventsIndexResultSortInput!]
  ): SearchDoorAccessAttemptSnapshotsConnection
    @authorize(policy: "Function:SearchDoorAccessAttempts")
