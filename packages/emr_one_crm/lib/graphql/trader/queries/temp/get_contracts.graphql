query GetContracts(
  $partyAccountNos: [String!]
  $take: Int
  $contractHeaderIds: [Int!]
  $cursor: String
  $dateSort: SortEnumType! = DESC
  $filterType: ContractSearchMode! = ALL,
  $activeFromDate : DateTime,
) {
  contracts(
    first: $take
    after: $cursor
    input: $filterType
    where: {
      or: [
        { partyAccountNo: { in: $partyAccountNos } }
        { contractHeaderId: { in: $contractHeaderIds } }
      ]
      and: [
        # 4 = Closed, 5 = Cancelled
        { contractStatusId: { neq: 4 } }
        { contractStatusId: { neq: 5 } }
        {
          or: [
            {endDate: {gte: $activeFromDate}}
            {endDate: {eq: null}}
          ]
        }
      ]
    }
    order: [{ startDate: $dateSort }]
  ) {
    pageInfo {
      endCursor
      hasNextPage
    }
    nodes {
      contractStatusId
      isSpot
      contractHeaderId
      contractOrderBookTypeId
      orderBook {
        contractOrderBookTypeName
      }
      startDate
      endDate
      contractRef
      accountManager
      currencyCode
      contractStatus {
        contractStatusId
        contractStatusName
      }
      contractType {
        contractTypeId
        contractTypeName
      }
      targetLoads
      customerContractRef
      partyAccountNo
      comment
      internalComments
      deliveryNotes
      paymentNotes
      priceTypeId
      modifiedDate
      contractLines(where: { active: { eq: true } }) {
        depotPremiums {
          depotPremiumId
          contractLineId
          depotNo
          depot {
            shortName
          }
          rateDelta
          rate
          rateUomValue
          rateUomId
          rateDeltaTypeId
        }
        lineLocations{
          locationId
          fullyCharged
          collectedPriceDeltaUomId
          collectedPriceDeltaUomValue
          haulageChargeUomId
          haulageChargeUomValue
          location{
            locationCode
            description
          }
        }
        msGrade{
          gradeCode
          gradeGroup
          gradeType
          comment
        }
        contractLineId
        isSpotPrice
        deliveredLoads
        deliveredTonnage
        grade
        materialDescription
        contractLineDeliveryMethodId
        partyArisingPointId
        targetTonnageUomValue
        targetTonnageUomId
        commodityRateUomValue
        commodityRateUomId
        haulageChargeAdjustmentRateUomValue
        haulageChargeAdjustmentRateUomId
        ctoFadjustment
        targetLoads
        commodityRateCollectedUomId
        commodityRateCollectedUomValue
        contractLineStatusId
        brokerReference
      }
    }
  }
}
