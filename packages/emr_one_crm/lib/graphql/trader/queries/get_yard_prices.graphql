query GetYardPrices(
  $searchDate: DateTime!
  $partyAccountNos: [String!]
  $pageSize: Int!
  $after: String
) {
  guidePrices(
    input: {
      publicationIds: []
      searchDate: $searchDate
      partyAccountNos: $partyAccountNos
    },
    first: $pageSize,
    after: $after
  ) {
    totalCount
    pageInfo {
      hasNextPage
      endCursor
    }
    nodes {
      partyAccountNo
      grade {
        gradeCode
        gradeType
        comment
      }
      yardCode
      finalPriceMt
      customerUom
    }
  }
}
