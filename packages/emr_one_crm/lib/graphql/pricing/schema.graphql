type Query {
  price(input: PriceInput!): Price
  pricingLocal(partyAccountNo: String!): PartyPrices
}

type Mutation {
  uploadPrices(priceFile: Upload): PriceUploadResult!
}

"""
The `Upload` scalar type represents a file upload.
"""
scalar Upload

input PriceInput {
  partyAccountNo: String!
  gradeCode: String!
  yardCode: String
  arisingPointCode: String
  contractRef: String
  uomId: Int
}

type Price {
  provRateUomValue: Decimal!
  provRateUomId: Int!
}

type PartyPrices {
  partyAccountNo: String
  price: [PartyPrice!]
}

type PriceUploadResult {
  success: Boolean!
}

type PartyPrice {
  id: Int!
  yard_Code: String
  party_Account_No: String
  grade: String
  rateUomValue: Decimal!
  rateUomID: Int!
  priority: Int!
  partyPublicationPosition: Int
  startDate: DateTime!
  endDate: DateTime
  locationCode: String
  contractRef: String
  contractTypeName: String
  contractLineDeliveryMethodName: String
  publicationIssueMaterialID: Int
}

"""
The built-in `Decimal` scalar type.
"""
scalar Decimal

"""
The `DateTime` scalar represents an ISO-8601 compliant date time type.
"""
scalar DateTime @specifiedBy(url: "https://www.graphql-scalars.com/date-time")
