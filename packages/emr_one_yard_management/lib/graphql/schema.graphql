"""
The `@defer` directive may be provided for fragment spreads and inline fragments to inform the executor to delay the execution of the current fragment to indicate deprioritization of the current fragment. A query with `@defer` directive will cause the request to potentially return multiple responses, where non-deferred data is delivered in the initial response and data deferred is delivered in a subsequent response. `@include` and `@skip` take precedence over `@defer`.
"""
directive @defer(
  """
  If this argument label has a value other than null, it will be passed on to the result of this defer directive. This label is intended to give client applications a way to identify to which fragment a deferred result belongs to.
  """
  label: String

  """
  Deferred when true.
  """
  if: Boolean
) on FRAGMENT_SPREAD | INLINE_FRAGMENT

"""
The `@stream` directive may be provided for a field of `List` type so that the backend can leverage technology such as asynchronous iterators to provide a partial list in the initial response, and additional list items in subsequent responses. `@include` and `@skip` take precedence over `@stream`.
"""
directive @stream(
  """
  If this argument label has a value other than null, it will be passed on to the result of this stream directive. This label is intended to give client applications a way to identify to which fragment a streamed result belongs to.
  """
  label: String

  """
  The initial elements that shall be send down to the consumer.
  """
  initialCount: Int! = 0

  """
  Streamed when true.
  """
  if: Boolean
) on FIELD

directive @authorize(
  """
  The name of the authorization policy that determines access to the annotated resource.
  """
  policy: String

  """
  Roles that are allowed to access the annotated resource.
  """
  roles: [String!]

  """
  Defines when when the resolver shall be executed.By default the resolver is executed after the policy has determined that the current user is allowed to access the field.
  """
  apply: ApplyPolicy! = BEFORE_RESOLVER
) repeatable on SCHEMA | OBJECT | FIELD_DEFINITION

type Query {
  allocationFilters: [FilterModel]
  lifecycleStatus: [String]
  containerSizes: [String]
  depots(searchTerm: String): [DepotModel]
  grades(searchTerm: String): [String]
  gradeGroup(searchTerm: String): [String]
  heaps(depotNos: [String], searchTerm: String): [HeapVm]
  kPIFilters: [FilterModel]
  liveLoads(filterModel: LiveLoadsQueryModelInput): [LiveLoadsModel]
  packageOptions: [String]
  parties(searchTerm: String): [PartiesVm]
  depotRegions(text: String): [String]
  routeToMarket(
    searchModel: RouteToMarketQueryModelInput

    """
    Returns the first _n_ elements from the list.
    """
    first: Int

    """
    Returns the elements in the list that come after the specified cursor.
    """
    after: String

    """
    Returns the last _n_ elements from the list.
    """
    last: Int

    """
    Returns the elements in the list that come before the specified cursor.
    """
    before: String
  ): RouteToMarketConnection
  salesGrade(searchTerm: String): [String]
  yards(searchTerm: String): [YardsVm]
}

type RouteToMarketVM {
  changeHistories: [ChangeHistoryVm]
  id: Long!
  depotNo: String
  grade: String
  route: String
  createdDate: DateTime!
  createdBy: UUID!
  modifiedDate: DateTime
  modifiedBy: UUID
  effectiveDate: DateTime
  active: Boolean!
}

enum ApplyPolicy {
  BEFORE_RESOLVER
  AFTER_RESOLVER
}

type ChangeHistoryVm {
  changeHistoryId: Int!
  tableName: String
  tableFriendlyName: String
  columnName: String
  columnFriendlyName: String
  modifiedDate: DateTime
  oldValue: String
  newValue: String
  rowChangedId: Long
  userName: String
}

"""
The `Long` scalar type represents non-fractional signed whole 64-bit numeric values. Long can represent values between -(2^63) and 2^63 - 1.
"""
scalar Long

"""
The `DateTime` scalar represents an ISO-8601 compliant date time type.
"""
scalar DateTime

scalar UUID

"""
A connection to a list of items.
"""
type RouteToMarketConnection {
  """
  Information to aid in pagination.
  """
  pageInfo: PageInfo!

  """
  A list of edges.
  """
  edges: [RouteToMarketEdge!]

  """
  A flattened list of the nodes.
  """
  nodes: [RouteToMarketVM]
}

"""
Information about pagination in a connection.
"""
type PageInfo {
  """
  Indicates whether more edges exist following the set defined by the clients arguments.
  """
  hasNextPage: Boolean!

  """
  Indicates whether more edges exist prior the set defined by the clients arguments.
  """
  hasPreviousPage: Boolean!

  """
  When paginating backwards, the cursor to continue.
  """
  startCursor: String

  """
  When paginating forwards, the cursor to continue.
  """
  endCursor: String
}

"""
An edge in a connection.
"""
type RouteToMarketEdge {
  """
  A cursor for use in pagination.
  """
  cursor: String!

  """
  The item at the end of the edge.
  """
  node: RouteToMarketVM
}

