query routeToMarket($searchModel: RouteToMarketQueryModelInput,$first:Int,$after:String,$before:String,$last:Int) {
  routeToMarket(
    first: $first
    after: $after
    last: $last
    before: $before
    searchModel: $searchModel
  ) {
    pageInfo {
      hasNextPage
      hasPreviousPage
      startCursor
      endCursor
    }
    nodes {
      changeHistories {
        changeHistoryId
        tableName
        tableFriendlyName
        columnName
        columnFriendlyName
        modifiedDate
        oldValue
        newValue
        rowChangedId
        userName
      }
      id
      depotNo
      grade
      route
      createdDate
      createdBy
      modifiedDate
      modifiedBy
      effectiveDate
      active
    }
  }
}

input RouteToMarketQueryModelInput {
  depotNo: [String]
  grade: String
  route: String
}
