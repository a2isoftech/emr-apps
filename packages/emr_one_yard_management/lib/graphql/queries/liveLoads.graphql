query liveLoads($filterModel:LiveLoadsQueryModelInput!){
    liveLoads(filterModel:$filterModel){
        type
        direction
        haulierName
        jobNumber
        customerLocation
        planned
        instruction
        actual
        remaining
        status
        statusOrder
        statusId
        fromYardCode
        toYardCode
        scheduledDate
        duration
    }
}

input LiveLoadsQueryModelInput {
  sort: QuerySortOptionInput
  search: LiveLoadsSearchInput!
  dataWithCompletedStatus: [LiveLoadsModelInput!]
}
input LiveLoadsModelInput {
  type: String!
  direction: String!
  haulierName: String!
  jobNumber: Int
  customerLocation: String!
  planned: String!
  instruction: String!
  actual: String!
  remaining: String!
  status: String!
  statusOrder: Int!
  statusId: Int!
  fromYardCode: String!
  toYardCode: String!
  scheduledDate: DateTime!
  duration: Float!
}
input LiveLoadsSearchInput {
  startDate: DateTime
  endDate: DateTime
  yardCode: String!
  customer: String
}

input QuerySortOptionInput {
  predicate: String!
  reverse: Boolean!
}