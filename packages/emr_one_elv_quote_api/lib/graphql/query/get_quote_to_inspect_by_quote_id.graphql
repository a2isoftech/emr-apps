query getQuoteToInspectByQuoteId($quoteId: Int!) {
  quoteToInspect(quoteId: $quoteId) {
    batchQuoteId
    account {
      accountNumber
      accountType
    }
    quoteSource
    quoteStatus
    total
    quoteId
    vehicleDescription {
      id
      year
      engineSize
      curbWeight
      curbWeightUom
      make
      model
      fuelType
      vehicleReg
      vin
    }
    catValue
    quoteLines {
      description
      price
    }
    vehicleConfiguration {
      vinUnreadable
      hasOriginalCat
      catDetails {
        location
        catClassification
        serialNumber
        sealNumber
        catValue
        matchProbability
        catalyticFill
        imagePath
        isManual
        vehicleCatId
        catId       
      }
      nonConformingParts {
        partName
        path
      }
      vehicleDocuments {
        imageType
        path
        documentType
        documentSubType
      }
      hasBattery
      batteryImage
      alloyWheels
      steelWheels
      priceAdjustment {
        componentName
        value
      }
    }
    leadSource
  }
}