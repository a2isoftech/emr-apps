query GetVehicleDocuments($batchQuoteId: Int!, $quoteId: Int!) {
  vehicleDocuments(batchQuoteId: $batchQuoteId, quoteId: $quoteId) {
    vehicleId
    vehicleReg
    vin
    documents {
      updatedAt
      imageType
      path
      documentType
      documentSubType
    }
    vehicleCats {
      vehicleCatId
      isManual
      updatedAt
      location
      catClassification
      serialNumber
      sealNumber
      catValue
      matchProbability
      catalyticFill
      imagePath
      catId
    }
    nonConformingParts {
      updatedAt
      partName
      path
    }
  }
}
