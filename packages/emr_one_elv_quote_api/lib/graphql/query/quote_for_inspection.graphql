query QuotesForInspectionQuery($first: Int!, $yardCode: String!, $searchText: String!) {
  quotesForInspection(
    first: $first
    after: null
    before: null
    last: null
    yardCode: $yardCode
    searchText: $searchText
  ) {
    nodes {
      batchQuoteId
      quoteStatus
      quote {
        quoteId
        createdDate
        quoteType
        hasBattery
        hasOriginalCat
        alloyWheels
        chromeWheels
        steelWheels
      }
      vehicleDetail {
        make
        model
        vin
        vehicleReg
        year
      }
    }
    pageInfo {
      hasNextPage
      hasPreviousPage
      startCursor
      endCursor
    }
    totalCount
  }
}
