    batchQuoteId: Int!
    quoteId: Int!
    configuration: VehicleConfigurationModelInput!
    territory: String!
    quoteChangedValue: Float!
  ): String!
  saveInspection(
    batchQuoteId: Int!
    quoteId: Int!
    configuration: VehicleConfigurationModelInput!
    territory: String!
