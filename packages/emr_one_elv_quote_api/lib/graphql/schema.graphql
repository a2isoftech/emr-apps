type Query {
  vehicleDocuments(
    batchQuoteId: Int!
    quoteId: Int!
  ): InspectionDocumentsResponse!
  quoteToInspect(quoteId: Int!): InspectionQuoteModel!
  quotesForInspection(
    yardCode: String!
    searchText: String!
    "Returns the first _n_ elements from the list."
    first: Int
    "Returns the elements in the list that come after the specified cursor."
    after: String
    "Returns the last _n_ elements from the list."
    last: Int
    "Returns the elements in the list that come before the specified cursor."
    before: String
    where: QuoteForInspectionResponseFilterInput
  ): QuotesForInspectionConnection
  batchQuote(
    input: BatchQuoteInput
    "Returns the first _n_ elements from the list."
    first: Int
    "Returns the elements in the list that come after the specified cursor."
    after: String
    "Returns the last _n_ elements from the list."
    last: Int
    "Returns the elements in the list that come before the specified cursor."
    before: String
    where: BatchQuoteModelFilterInput
    order: [BatchQuoteModelSortInput!]
  ): BatchQuoteConnection
}

