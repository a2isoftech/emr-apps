mutation PatchPaymentRecordStatus($paymentRecordId: String!, $paymentStatus: PaymentStatus!) {
  patchPaymentRecordStatus(paymentRecordId: $paymentRecordId, paymentStatus: $paymentStatus) {
    isSuccess
    result{
    ...PaymentRecordFields
    }
    error{
      errorCode
      errorMessage
      details{
        key
        value
      }
    }
    warning{
      code
      message
      details{
        key
        value
      }
    }
  }
}