query GetAllPaymentRules(  
  $PaymentRuleId: GetPaymentRuleInput
  $before: String
  $after: String
  $first: Int
  $last: Int
  $order: [PaymentRulesSortInput!]
) {
  paymentRules(input: $PaymentRuleId
    before: $before
    after: $after
    first: $first
    last: $last
    order: $order
  ) {
    edges {
      node {
        ...PaymentRuleFragment
      }
    }
    totalCount
    pageInfo {
      endCursor
      hasNextPage
      hasPreviousPage
      startCursor
    }
  }
}
