query searchPaymentTickets(
  $after: String
  $before: String
  $first: Int
  $last: Int
  $input: SearchTicketsInput!
  $order: [SearchTicketsSortInput!]
) {
  searchTickets(
    after: $after
    before: $before
    first: $first
    last: $last
    input: $input
    order: $order
  ) {
    totalCount
    pageInfo {
      hasNextPage
      hasPreviousPage
      startCursor
      endCursor
    }
    nodes {
      ... TicketFields
      paymentValidationResult{
        ... PaymentRuleResultFields
      }
    }
  }
}
