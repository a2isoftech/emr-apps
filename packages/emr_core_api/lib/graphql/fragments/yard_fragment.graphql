            commissionPercent
            enabled
            paymentMethod
            rounding {
              roundingType
              value
            }
            maxUpperLimit
          }
          digitalWalletWithCash {
            commissionPercent
            enabled
            paymentMethod
            rounding {
              roundingType
              value
            }
            maxUpperLimit
          }
          fasterpay {
            enabled
            flatFeeValue
            paymentMethod
            bankCode
            maxUpperLimit
          }
