  requestType: String
  userNotes: String
  assetCode: String
  serviceLevel: Int!
  user: String
  faultSymptom: String
  cMMSId: String
  createdDate: DateTime!
  attachments: [MediaItemInput!]
}

type APIResultOfSaveInstancePayload {
  data: SaveInstancePayload
  message: String
  errorDetails: String
  errorLevel: APIResultType!
  errorCode: Codes
}

input InstanceSaveRequestInput {
  id: UUID!
  document: String
  scheduledItemId: UUID!
}

type WorkRequestServiceLevel {
  id: Int!
  name: String
}

type SaveInstancePayload {
  id: UUID!
  databaseId: Int!
  invalidMedia: [SaveInstanceMediaMessage!]!
}

input MediaItemInput {
  id: UUID!
  mediaType: MediaTypeId!
  mediaPath: String
  thumbnailPath: String
  isUploaded: Boolean!
  createdBy: String
  createdDate: DateTime!
