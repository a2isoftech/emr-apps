schema {
  query: FormsQuery
  mutation: FormsMutations
}

"""
The `@defer` directive may be provided for fragment spreads and inline fragments to inform the executor to delay the execution of the current fragment to indicate deprioritization of the current fragment. A query with `@defer` directive will cause the request to potentially return multiple responses, where non-deferred data is delivered in the initial response and data deferred is delivered in a subsequent response. `@include` and `@skip` take precedence over `@defer`.
"""
directive @defer(
  """
  If this argument label has a value other than null, it will be passed on to the result of this defer directive. This label is intended to give client applications a way to identify to which fragment a deferred result belongs to.
  """
  label: String

  """
  Deferred when true.
  """
  if: Boolean
) on FRAGMENT_SPREAD | INLINE_FRAGMENT

"""
The `@stream` directive may be provided for a field of `List` type so that the backend can leverage technology such as asynchronous iterators to provide a partial list in the initial response, and additional list items in subsequent responses. `@include` and `@skip` take precedence over `@stream`.
"""
directive @stream(
  """
  If this argument label has a value other than null, it will be passed on to the result of this stream directive. This label is intended to give client applications a way to identify to which fragment a streamed result belongs to.
  """
  label: String

  """
  The initial elements that shall be send down to the consumer.
  """
  initialCount: Int! = 0

  """
  Streamed when true.
  """
  if: Boolean
) on FIELD

scalar UUID

type FormTemplate {
  document: String
  id: ID!
  templateId: UUID
  version: Int!
  title: String
  description: String
  clientId: Int!
}

type Territory {
  yards: [Yard!]
  name: String
}

type FormInstance {
  document: String
  id: ID!
  template: FormTemplate
  scheduledItemId: UUID
  templateVersionId: UUID!
  status: String
  depotNo: String
  workOrderId: String
  assetCode: String
  companyCode: String
  jobType: String
  jobTypeVariant: String
  startedBy: String
  startedDate: DateTime
  submittedBy: String
  submittedDate: DateTime
  workOrderDescription: String
  jobTrade: String
  assignedTo: String
}

type JobForms {
  inProgress: [FormInstance!]!
  scheduled: [ScheduledJobForm!]!
  filteredForUser: [ScheduledJobForm!]!
  countsOnly: JobCounts!
  yardCode: String
  forcedUpdate: Boolean!
}

type ScheduledJobForm {
  template: FormTemplate
  scheduledItemId: UUID
  job: WorkOrderInfo
}

type Asset {
  maintenance: AssetMaintenanceDetails!
  assetCode: String!
  assetType: String
  name: String
  yardCode: String!
  depotNo: String!
}

type Yard {
  assets: [Asset!]!
  yardCode: String
  name: String
}

type Depot {
  assets: [Asset!]!
  workRequestOptions: WorkRequestListSelections!
  yardCode: String
  depotNo: String
  name: String
  companyCode: String
}

type FormsQuery {
  assets(filter: AssetQueryFilterInput!): [Asset!]!
  listValues(listName: String!): [ListValue!]!
  assetProperty(assetCode: String!, territoryCode: String!): [AssetProperty!]!
  depots(filter: DepotQueryFilterInput!): [Depot!]!
  formInstance(id: UUID!): FormInstance
  formInstances(filter: InstanceQueryFilterInput!): [FormInstance!]!
  completedFormInstances(
    filter: CompletedFormInstanceQueryFilterInput!
  ): [CompletedFormInstance!]!
  mediaItemsForWorkOrder(
    companyCode: String!
    workOrderId: String!
  ): [MediaItem!]!
  mediaItemsForInstance(instanceId: UUID!): [MediaItem!]!
  exportPdfForCompletedJobs(
    filter: ExportPdfForCompletedJobsFilterInput!
  ): ExportPdfForCompletedJobs!
  formTemplate(id: UUID!): FormTemplate
  formTemplates: [FormTemplate!]!
  clients: [Client!]!
  formTemplateReferenceId(referenceId: String!): Boolean!
  adhocTemplateJson(request: CreateAdhocTemplateRequestInput!): TemplateDto!
  nextTemplateNumber: NextTemplateNumber!
  formTemplateJson(id: UUID!): FormTemplate
  jobFormsForYard(
    yardCode: String!
    startDate: DateTime
    endDate: DateTime
    filterForUser: Boolean
    forcedUpdate: Boolean! = false
  ): JobForms!
  mediaItemsForWorkRequest(
    companyCode: String!
    workRequestId: String!
  ): [MediaItem!]!
  formTemplatesByName(filter: SearchQueryFilterInput!): [FormTemplate!]!
  users(filter: String!): [EMRUsers!]!
  territories: [String!]!
  territory(code: String!): Territory!
  closestYard(latitude: Float!, longitude: Float!): Yard
}

type FormsMutations {
  createWorkRequest(workRequest: WorkRequestInfoInput!): APIResult!
  saveFormInstance(
    data: InstanceSaveRequestInput!
  ): APIResultOfSaveInstancePayload!
}

"""
The `DateTime` scalar represents an ISO-8601 compliant date time type.
"""
scalar DateTime

type JobCounts {
  assignedJobsCount: Int!
  scheduleTasksCount: Int!
  yardJobsCount: Int!
  completedJobsCount: Int!
  canScheduleTask: Boolean!
  canViewReport: Boolean!
}

type WorkOrderInfo {
  workOrderId: String!
  companyCode: String!
  asset: Asset
  expectedStartDate: DateTime!
  expectedEndDate: DateTime!
  jobType: String!
  jobTrade: String!
  jobTypeVariant: String
  referenceId: String
  referenceType: String
  workOrderDescription: String
  assignedTo: String
  assignedBy: String
  assignedDate: DateTime
  assignedTypeId: Int
}

type AssetMaintenanceDetails {
  assetType: String
  faultSymptoms: [String!]
}

type WorkRequestListSelections {
  serviceLevels: [WorkRequestServiceLevel!]
  requestTypes: [String!]
}

input CompletedFormInstanceQueryFilterInput {
  workOrderId: String
  yardCode: String
  startDate: DateTime
  endDate: DateTime
  jobDescription: String
  jobType: String
}

type CompletedFormInstance {
  yardCode: String
  scheduledItemId: UUID
  templateVersionId: UUID!
  status: String
  depotNo: String
  workOrderId: String
  assetCode: String
  companyCode: String
  jobType: String
  jobTypeVariant: String
  startedBy: String
  startedDate: DateTime
  submittedBy: String
  submittedDate: DateTime
  template: FormTemplate
  workOrderDescription: String
  jobTrade: String
  assignedTo: String
  id: UUID!
  document: String
  documentPath: String
}

input InstanceQueryFilterInput {
  yardCode: String
  asset: [FormQueryAssetFilterInput!]
  status: [String!]
  statusId: [FormInstanceStatusId!]
  forCurrentUser: Boolean
  startDate: DateTime
  startDate: DateTime
  endDate: DateTime
}

input DepotQueryFilterInput {
  depotNos: [String!]
  yardCodes: [String!]
  searchText: String
}

type AssetProperty {
  assetCode: String
  propertyValue: Decimal
  propertyMinValue: Decimal
  propertyMaxValue: Decimal
  active: Boolean!
  checkBothMinMax: Boolean!
  territoryCode: String
  propertyKey: String
  propertyKeyWithTerritory: String
}

type ListValue {
  id: Int!
  listId: Int!
  text: String
  value: String
  orderIndex: Int!
  active: Boolean!
  list: List
}

input AssetQueryFilterInput {
  assetCodes: [String!]
  yardCodes: [String!]
  depotNos: [String!]
  assetTypes: [String!]
  searchText: String
}

type MediaItem {
  id: UUID!
  mediaType: MediaTypeId!
  mediaPath: String
  thumbnailPath: String
  isUploaded: Boolean!
  createdBy: String
  createdDate: DateTime!
  uploadDate: DateTime
}

type ExportPdfForCompletedJobs {
  zipFileAsBase64: String!
}

input ExportPdfForCompletedJobsFilterInput {
  workOrderIds: [String!]!
}

type Client {
  id: String!
  title: String!
}

type TemplateDto {
  title: String!
  uuid: UUID!
