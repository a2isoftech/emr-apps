}

input CreateAdhocTemplateRequestInput {
  referenceId: String
  description: String
  isQuickTemplate: Boolean!
  sections: [TemplateSectionInput!]!
}

type NextTemplateNumber {
  data: String!
}

input SearchQueryFilterInput {
  searchText: String
  includeAll: Boolean!
}

type EMRUsers {
  id: UUID!
  firstName: String
  surname: String
