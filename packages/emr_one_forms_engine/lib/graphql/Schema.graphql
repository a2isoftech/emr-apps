  IN_PROGRESS
  READY_TO_SUBMIT
  SUBMITTED
  SUBMIT_FAILED
  CANCELED
}

input FormQueryAssetFilterInput {
  assetCode: String
  jobType: String
}

input TemplateQuestionsInput {
  question: String
  questionType: String
  validator: String
