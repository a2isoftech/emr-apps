name: emr_one_forms_engine
description: Engine for displaying and completing EMR Forms
version: 3.1.0
homepage: https://dev.azure.com/emrtf01/EMR_Software/_git/EmrOneFormsEngine
repository: https://dev.azure.com/emrtf01/EMR_Software/_git/EmrOneFormsEngine
publish_to: "none"

environment:
  sdk: ^3.11.0

resolution: workspace

dependencies:
  bloc: ^8.1.1
  chewie: ^1.4.0
  connectivity_plus: ^6.0.3
  cross_file: ^0.3.5
  emr_one_core:
    path: ../emr_one_core
  equatable: ^2.0.5
  flutter:
    sdk: flutter
  flutter_bloc: ^8.1.2
  font_awesome_flutter: ^11.0.0
  gql: ^1.0.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  http: ^1.6.0
  http_parser: ^4.1.2
  image_picker: ^1.1.2
  intl: any
  mime: ^2.0.0
  path: ^1.8.2
  path_provider: ^2.1.5
  shared_preferences: ^2.5.3
  universal_html: ^2.3.0
  universal_io: ^2.2.2
  url_launcher: ^6.1.10
  uuid: ^4.4.0
  video_player: ^2.9.5
  video_thumbnail: ^0.5.6

dev_dependencies:
  build_runner: ^2.1.10
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter
  graphql_codegen: ^3.0.1
  # hive_generator: ^2.0.0
  mockito: ^5.4.4

# For information on the generic Dart part of this file, see the
