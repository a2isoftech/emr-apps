  ): ValidatedBankAccount @authorize(policy: "EmrInternalUsers")
  lookupUKPostcode(location: String!): [AddressLookupOutput!]!
    @deprecated(
      reason: "This method would be deprecated soon. Use combination of LookupAddress and LookupAddressDetails instead."
    )
