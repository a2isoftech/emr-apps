type Mutation {
  createProspectAccount(
    input: CreateProspectRetailAccountInput
  ): CreateAccountOutput
    @authorize(policy: "SelfServePortalPartialSignedUpPolicy")
  createDocument(input: CreateNewDocumentInput): UpdateAccountOutput
    @authorize(policy: "SelfServePortalPartialSignedUpPolicy")
  createDocumentInternal(
    accountNumber: String!
    input: CreateNewDocumentInput
  ): UpdateAccountOutput @authorize(policy: "EmrInternalUsers")
  updatePaymentDetails(input: UpdatePaymentDetailsInput): UpdateAccountOutput
    @authorize(policy: "SelfServePortalPartialSignedUpPolicy")
  updatePaymentDetailsInternal(
    accountNumber: String
    input: UpdatePaymentDetailsInput
  ): UpdateAccountOutput @authorize(policy: "EmrInternalUsers")
  updateSelfServeAccountAccount(
    input: UpdateSelfServeAccountInput
  ): UpdateAccountOutput!
    @authorize(policy: "SelfServePortalPartialSignedUpPolicy")
  updateSelfServeAccountInternal(
    accountNumber: String
    input: UpdateSelfServeAccountInput
  ): UpdateAccountOutput! @authorize(policy: "EmrInternalUsers")
  convertProspectToRetailAccount: UpdateAccountOutput
  createProspectAccountInternal(
    input: CreateProspectRetailAccountInput
  ): CreateAccountOutput! @authorize(policy: "EmrInternalUsers")
  convertProspectToRetailAccountInternal(
    accountCode: String!
    userId: String!
  ): UpdateAccountOutput! @authorize(policy: "EmrInternalUsers")
  createLiteRetailAccount(
    input: CreateLiteRetailAccountInput!
  ): CreateAccountInternalOutput! @authorize(policy: "EmrInternalUsers")
  createElvRetailAccount(
    input: CreateLiteRetailAccountInput!
  ): CreateAccountInternalOutput! @authorize(policy: "EmrInternalUsers")
  createRetailAccount(input: CreateRetailAccountInput!): CreateAccountOutput!
    @authorize(policy: "EmrInternalUsers")
  createDocumentForRetail(
    input: CreateNewDocumentInput
    accountNumber: String!
  ): UpdateAccountOutput! @authorize(policy: "EmrInternalUsers")
  updatePaymentDetailsForRetail(
    accountNumber: String!
    input: UpdateBankAccountInput!
  ): UpdateAccountOutput! @authorize(policy: "EmrInternalUsers")
  updateAccount(input: UpdateAccountInput!): UpdateAccountOutput!
    @authorize(policy: "EmrInternalUsers")
}

