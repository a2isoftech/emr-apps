query GetPartyPrimaryManager {
  account {
    name
    accountContacts {
      value{
        firstName
        middleName
        lastName
        contactTypes
      }
    }

    primaryManager{
      type
      id
      name
    }
    accountAddresses {
      key
      address1
      postCode
      countryCode
    }  
    defaultYardCode  
  }
}
