query GetSignupModel{
  account{
    accountNumber
    name
    countryId
    industryGroupTypeId
    agreeToCELEncashment
    visitFrequency
    defaultYardCode
    accountContacts {
      accountContactTypeId
      contact {
        firstName
        lastName
        contactInformation {
          countryId
          value
          contactInformationTypeId
        }
        contactPreferences {
          contactPreferenceTypeId
          value
        }
        documents {
          documentTypeId
          documentSubTypeId
          expirationDate
          active
          fileId
          fileName
          filePath
          issuedByCounty
        }        
      }      
    }
    bankAccounts {
      accountHolderName
      bankAccountNumber
      sortCode
      bankName
      active
    }
    address{
      address1
      address2
      address3
      postCode
      countryId
    } 
  }
}