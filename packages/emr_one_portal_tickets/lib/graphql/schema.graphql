"""
Returns list of avalaible remittances with payment Date.
"""
type Query {
  """
  Returns ticket with lines.
  """
  ticket(ticketNumber: Int!, depotNumber: String!): Trade2Ticket

  """
  Returns all paid tickets for the party.
  """
  tickets(
    ticketNumber: Int
    searchText: String

    """
    Returns the first _n_ elements from the list.
    """
    first: Int

    """
    Returns the elements in the list that come after the specified cursor.
    """
    after: String

    """
    Returns the last _n_ elements from the list.
    """
    last: Int

    """
    Returns the elements in the list that come before the specified cursor.
    """
    before: String
    where: PaidTicketSummaryFilterInput
    order: [PaidTicketSummarySortInput!]
  ): TicketsConnection

  """
  Returns Ticket Remittance File SaS token
  """
  remittanceForTicket(ticketNumber: Int!): String

  """
  Returns shared access token to communicate with media api.
  """
  mediaApiUrlWithToken(fileName: String!): String

  """
  Returns Invoices
  """
  invoices(
    """
    Returns the first _n_ elements from the list.
    """
    first: Int

    """
    Returns the elements in the list that come after the specified cursor.
    """
    after: String

    """
    Returns the last _n_ elements from the list.
    """
    last: Int

    """
    Returns the elements in the list that come before the specified cursor.
    """
    before: String
    where: InvoiceFilterInput
    order: [InvoiceSortInput!]
  ): InvoicesConnection

  """
  Returns Statements which are invoices containing Due date and Invoice File details
  """
  supplierStatements(
    statementStatus: StatementStatusInput
    searchText: String

    """
    Returns the first _n_ elements from the list.
    """
    first: Int

    """
    Returns the elements in the list that come after the specified cursor.
    """
    after: String

    """
    Returns the last _n_ elements from the list.
    """
    last: Int

    """
    Returns the elements in the list that come before the specified cursor.
    """
    before: String
    where: SupplierStatementSummaryFilterInput
    order: [SupplierStatementSummarySortInput!]
  ): SupplierStatementsConnection

  """
  Returns Invoice File SaS token
  """
  invoiceFileSASToken(purchaseOrderNo: String!, invoiceNo: String!): String

  """
  Returns true if the request is payable else throws an exception.
  """
  isRequestPayable(requestForPayment: PortalPaymentRequestInput!): Boolean!

  """
  Returns account change requests for the account.
  """
  accountChangeRequests(
    where: PortalAccountChangeRequestFilterInput
  ): [PortalAccountChangeRequest!]!

  """
  Returns company details
  """
  company(companyId: String!): Company!

  """
  Returns all companies.
  """
  companies: [Company!]!

  """
  Returns Ticket Remittance paid date. To get the SaS token to remittance use RemittanceDownloadQuery
  """
  supplierRemittances(
    searchText: String
    sortOrders: [RemittanceSortOrderInput!]

    """
    Returns the first _n_ elements from the list.
    """
    first: Int

    """
    Returns the elements in the list that come after the specified cursor.
    """
    after: String

    """
    Returns the last _n_ elements from the list.
    """
    last: Int

    """
    Returns the elements in the list that come before the specified cursor.
    """
    before: String
  ): SupplierRemittancesConnection

  """
  Returns Supplier Remittance File SaS token
  """
  supplierRemittance(createDate: DateTime!): String

  """
  Returns Pricelists for the user.
  """
  partyPricelistSummary(
    productType: ProductType!
    yardCode: String!
    searchText: String

    """
    Returns the first _n_ elements from the list.
    """
    first: Int

    """
    Returns the elements in the list that come after the specified cursor.
    """
    after: String

    """
    Returns the last _n_ elements from the list.
    """
    last: Int

    """
    Returns the elements in the list that come before the specified cursor.
    """
    before: String
    where: PartyPricelistSummaryFilterInput
    order: [PartyPricelistSummarySortInput!]
  ): PartyPricelistSummaryConnection

  """
  Returns a list of yards avalaible yards based on the provide country code
  """
  yards(countryCode: CountryCode): [Yard!]!

  """
  Returns market prices for specified territory and product type.
  """
  marketPrice(
    territoryCode: String!
    productType: String!
    cutOffDate: DateTime
  ): MarketPriceResult
}

