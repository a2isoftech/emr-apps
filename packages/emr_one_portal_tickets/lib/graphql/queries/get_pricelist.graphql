query GetPricelist($yardCode: String!, $productType: ProductType!, $searchText : String,
    $first: Int, $last: Int, $before: String, $after: String,  $order: [PartyPricelistSummarySortInput!]){
    partyPricelistSummary(
        yardCode: $yardCode,
        productType: $productType,
        searchText: $searchText,
        first: $first,
        after: $after,
        last: $last,
        before: $before,
        order: $order
    )
    {
        totalCount
        pageInfo {
            hasNextPage
            hasPreviousPage
            startCursor
            endCursor
        }
        nodes {
            description
            deliveryMethod
            price
            updatedDate
            uoM
            notes
            grade
        }
    }
}