query GetpaidTickets($cutOffDate: DateTime!, $pageSize: Int!, $after: String, $order: [PaidTicketSummarySortInput!], $searchText: String) {
  tickets(
    first: $pageSize,
    after: $after,
    order: $order,
    where: {
      and: [
        {trade2TicketStatus: {in: ["IP", "DP", "PC"]}},
        {ticketDate: {gte: $cutOffDate}}]},
        searchText : $searchText)
        {
          totalCount
          pageInfo {
            hasPreviousPage
            hasNextPage
            startCursor
            endCursor
            __typename
          }
          nodes {
            amount
            currency
            ticketDate
            ticketNumber
            yardName
            yardCode
            ticketStatus
            trade2TicketStatus
            fileName
            __typename
          }
          __typename
        }
      __typename
}