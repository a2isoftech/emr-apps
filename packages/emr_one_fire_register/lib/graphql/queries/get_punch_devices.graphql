query GetPunchDevices {
  punchDevices(where: { active: { eq: true } }) {
    id
    clockDevice
    zone
    yardCode
    deviceAreas {
        active
        areaGuid
        areaName
        areaZones {
            active
            musterPoint
            zoneGuid
            zoneName
        }
    }
  }
}

query GetYardAreas ($yardCode: String!) {
  deviceAreas(where: { yardCode: { eq: $yardCode }, areaZones: { some: { active: {eq: true} } } }) {
    active
    areaGuid
    areaName
  }
}

query GetDeviceAreaZones($areaName: String!, $yardCode: String!) {
  punchDevices(
    where: {
      yardCode: { eq: $yardCode }
      active: { eq: true }
      deviceAreas: {
        some: {
          active: { eq: true }
          areaName: { eq: $areaName }
          areaZones: { some: { active: { eq: true } } }
        }
      }
    }
  ) {
    deviceAreas {
      areaZones {
        active
        musterPoint
        zoneGuid
        zoneName
      }
    }
  }
}