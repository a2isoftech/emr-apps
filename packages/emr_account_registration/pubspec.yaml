name: emr_account_registration
description: Reusable package for account registration to be used in multiple applications like portal, weighbridge, emr apps etc
version: 2.0.4

homepage: https://dev.azure.com/emrtf01/EMR_Software/_git/emr_one?version=GBdevelop&path=/packages/emr_account_registration
repository: https://dev.azure.com/emrtf01/EMR_Software/_git/emr_one?version=GBdevelop
publish_to: "none"

environment:
  sdk: ^3.11.0

resolution: workspace

dependencies:
  async: ^2.13.0
  collection: ^1.19.1
  emr_core_api:
    path: ../emr_core_api
  emr_one_core:
    path: ../emr_one_core
  emr_one_theme:
    path: ../emr_one_theme
  emr_sharedtypes:
    path: ../emr_sharedtypes
  file_picker: ^8.1.7
  firebase_auth: ^5.3.1
  firebase_remote_config: ^5.1.3
  flutter_image_compress: ^2.4.0
  flutter:
    sdk: flutter
  flutter_widget_from_html: ^0.17.1
  geolocator: ^14.0.2
  gql_exec: ^1.0.0
  http: ^1.6.0
  http_parser: ^4.1.2
  image_picker: ^1.1.2
  intl: any
  json_annotation: ^4.9.0
  path_provider: ^2.1.5
  provider: ^6.1.5
  shared_preferences: ^2.5.3
  url_launcher: ^6.1.14
  uuid: ^4.4.0
  mobile_scanner: ^7.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

