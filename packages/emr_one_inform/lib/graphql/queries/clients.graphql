query getClients($clientName: String, $isEditable: Boolean, $isD365: Boolean, $canSchedule: Boolean) {
  clients(clientName: $clientName, isEditable: $isEditable, isD365: $isD365, canSchedule: $canSchedule) {
    id
    title
    isEditable
    isD365
    isActive
    defaultWorkRequestType
    canSchedule
  }
}