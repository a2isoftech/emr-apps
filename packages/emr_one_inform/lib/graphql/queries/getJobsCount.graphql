query GetJobsCount(
  $yardCode: String!
  $startDate: DateTime
  $endDate: DateTime
  $filterForUser: Boolean
) {
  jobFormsForYard(
    yardCode: $yardCode
    startDate: $startDate
    endDate: $endDate
    filterForUser: $filterForUser
  ) {
    countsOnly {
      canScheduleTask
      canViewReport
      workRequestsCount
      unassignedJobsCount
      userJobs {
        newJobs {
          count
          recentActivities
        }
        inProgressJobs {
          count
          recentActivities
        }
        completedJobs {
          count
          recentActivities
        }
      }
      yardJobs {
        newJobs {
          count
          recentActivities
        }
        inProgressJobs {
          count
          recentActivities
        }
        completedJobs {
          count
          recentActivities
        }
      }
    }
  }
}
