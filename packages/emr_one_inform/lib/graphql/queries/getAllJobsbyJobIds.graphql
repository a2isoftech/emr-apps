query GetAllJobsbyJobIds( 
    $first: Int,
    $after: String,
    $last: Int,
    $before: String,
    $filter: DiagnosticJobFormFilterInput!,) {
  jobFormsForDiagnostics(
    filter: $filter,
    first: $first,
    last: $last,
    before: $before,
    after: $after
  ) {
        nodes {
            assetCode
            scheduledItemId
            depotNo
            id
            jobType
            jobTypeVariant
            startedBy
            startedDate
            status
            submittedBy
            submittedDate
                template {
                description
                id
                templateId
                title
                version
                isDigitalSignatureRequired
                referenceId
            }
            templateVersionId
            workOrderId
            workOrderDescription
            jobTrade
            assignedTo
            isDigitalSignatureRequired
            assignedToTeam
            assignedToTeamId
            yardCode
            scheduleItemType
            jobPriority
            notes
            status
            scheduledItemStatus
            d365Status
            d365Error
            companyCode
            capturedMediaCount
        }
        pageInfo{
            hasNextPage
            startCursor
            endCursor
        }  
        }
    }
