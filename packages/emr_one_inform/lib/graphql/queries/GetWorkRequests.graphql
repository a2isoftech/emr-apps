query GetWorkRequests($filter: WorkRequestQueryFilterInput!) {
  workRequests(filter: $filter) {
    id
    actualStartDate
    productionStopDate
    requestState
    startedByPersonnelNumber
    jobTypeVariant
    actualEndDate
    responsiblePersonnelNumber
    notes
    workOrderId
    jobType
    companyCode
    jobTradeId
    faultSymptoms
    depotNo
    yardCode
    createdDate
    modifiedDate
    isActive
    workRequestId
    description
    additionalDescription
    requestType
    serviceLevel
    assetId
    assetCode
    workerGroupId    
  }
}