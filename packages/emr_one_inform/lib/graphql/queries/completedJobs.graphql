query CompletedJobs(
  $first: Int
  $after: String
  $last: Int
  $before: String
  $filter: CompletedFormInstanceQueryFilterInput!
) {
  completedFormInstances(
    first: $first
    after: $after
    last: $last
    before: $before
    filter: $filter
  ) {
    nodes {
      workOrderId
      workOrderDescription
      startedBy
      companyCode
      submittedBy
      submittedDate
      assetCode
      assetName
      jobType
      jobTrade
      jobTypeVariant
      yardCode
      depotNo
      scheduledItemId
      isDigitalSignatureRequired
      scheduleItemType
      assignedToTeam
      assignedToTeamId
      validations {
        validatedBy
        validatedOn
        status
        notes
        referenceId
      }
      jobPriority
      notes
      template {
        document
        id
        templateId
        version
        title
        description
        clientId
        referenceId
        isDigitalSignatureRequired
        validateBySignature
        validateByWorkOrder
        validateFrom
        isEmailNotificationRequired
        sendEmailOnFailedQuestions
        emailIds
        assignFailedQuestionToTeam
        assignFailedQuestionToTeamId
      }
      teamName
      category
    }
    pageInfo {
      hasNextPage
      startCursor
      endCursor
    }
  }
}
