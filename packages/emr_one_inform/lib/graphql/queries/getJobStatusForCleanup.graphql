query GetJobStatusForCLeanUp( 
    $first: Int,
    $after: String,
    $last: Int,
    $before: String,
    $filter: DiagnosticJobFormFilterInput!) {
  jobFormsForDiagnostics(
    filter: $filter,
    first: $first,
    last: $last,
    before: $before,
    after: $after
  ) {
        nodes {
            scheduledItemId
            id
            startedBy
            startedDate
            submittedBy
            submittedDate
            workOrderId
            workOrderDescription
            status
            scheduledItemStatus
            d365Status
            d365Error
        }
        pageInfo{
            hasNextPage
            startCursor
            endCursor
        }  
        }
    }
