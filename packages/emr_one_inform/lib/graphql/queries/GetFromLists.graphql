query GetFormLists($startDate: DateTime, $endDate: DateTime, $listName: String, $createdBy: String) {
  formLists(startDate: $startDate, endDate: $endDate, listName: $listName, createdBy: $createdBy) {
    id
    listName
    listValues
    createdBy
    createdDate
    modifiedBy
    modifiedDate
    isActive
  }
}
