
query GetJobFormsForYard( 
    $firstIn: Int
    $afterIn: String
    $lastIn: Int
    $beforeIn: String
    $yardCode: String!, 
    $startDate: DateTime,
    $endDate: DateTime, 
    $filterForUser: Boolean, 
    $forcedUpdate: Boolean = false, 
    $jobId: String, 
    $assetCode: String) {
    jobFormsForYard(yardCode: $yardCode, 
    startDate: $startDate, 
    endDate: $endDate, 
    filterForUser: $filterForUser, 
    forcedUpdate: $forcedUpdate, 
    jobId: $jobId, 
    assetCode: $assetCode) {
        yardCode
        inProgress(first: $firstIn
        after: $afterIn
        last: $lastIn
        before: $beforeIn) {
        nodes {
            assetCode
            scheduledItemId
            depotNo
            id
            jobType
            jobTypeVariant
            startedBy
            startedDate
            status
            submittedBy
            submittedDate
                template {
                description
                id
                templateId
                title
                version
                isDigitalSignatureRequired
                referenceId
            }
            templateVersionId
            workOrderId
            workOrderDescription
            jobTrade
            assignedTo
            isDigitalSignatureRequired
            assignedToTeam
            assignedToTeamId
            yardCode
            scheduleItemType
            jobPriority
            notes
        }
        pageInfo{
            hasNextPage
            startCursor
            endCursor
        }  
        }
    }
}  
