query GetAssignedJobs(
  $first: Int
  $after: String
  $last: Int
  $before: String
  $yardCode: String!
  $startDate: DateTime
  $endDate: DateTime
  $filterForUser: Boolean
  $assetCode: String
  $jobId: String
) {
  jobFormsForYard(
    yardCode: $yardCode
    startDate: $startDate
    endDate: $endDate
    filterForUser: $filterForUser
    assetCode: $assetCode
    jobId: $jobId
  ) {
    filteredForUser(
      first: $first
      after: $after
      last: $last
      before: $before
    ) {
      nodes {
        template {
          id
          templateId
          version
          title
          description
          referenceId
          isDigitalSignatureRequired
          isEmailNotificationRequired
          sendEmailOnFailedQuestions
          emailIds
          assignFailedQuestionToTeam
          assignFailedQuestionToTeamId
        }
        scheduledItemId
        job {
          workOrderId
          workOrderDescription
          originalDescription
          assignedTo
          assignedBy
          assignedDate
          assignedTypeId
          companyCode
          asset {
            assetCode
            assetType
            name
            yardCode
            depotNo
          }
          expectedStartDate
          expectedEndDate
          jobType
          jobTrade
          jobTypeVariant
          referenceId
          referenceType
          yardCode
          depotNo
          isDigitalSignatureRequired
          scheduleItemType
          category
          jobPriority
          notes
          assignedToTeam
          assignedToTeamId
        }
      }
      pageInfo {
        hasNextPage
        startCursor
        endCursor
      }
    }
  }
}
