query NewAssetByTemplateId($templateId: String!) {
  newAssetByTemplateId(templateId: $templateId) {
     active
    approved
    parentAssetId
    code
    name
    make
    model
    serialNumber
    depotNo
    functionalLocationCode
    transferToDepotNo
    transferToDepotNoEffectiveFrom
    transferToDepotNoAssetApprovalId
    latitude
    longitude
    templateId
    dateOfAcquisition
    dateOfDisposal
    farLeasedExpensed
    yearOfManufacture
    condition
    status
    disposalStatus
    disposalEffectiveFrom
    disposalApprovalId
    statutoryInspection
    salesInvoiceNo
    assetProperties {
      dataType
      templatePropertyId
      propertyValue
      propertyValueNumber
      id
      name
      isMandatory
      active
      sequence
    }
    assetCounters {
      assetTemplateCounterId
      value
      valueTimestamp
      name
    }
    id
    assetImages{
      id
      filename
      url
      comments
    }
    permittedHours{
      key
      value{
        start
        end
      }
    }
    shiftHours{
      key
      value{
        start
        end
      }
    }
    parentAssetCodes
    hasSubAssets
    codaAnalysisCode
    assetHierarchyId
    displayName
    needsReview
    lastReviewed
    lastReviewedBy
    lastAudited
    lastAuditedBy
    lastStatutoryInspectionDate
    statutoryInspectionIntervalMonths
  }
}
