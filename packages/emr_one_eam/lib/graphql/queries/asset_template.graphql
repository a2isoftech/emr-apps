
query GetAssetTemplates($where: AssetTemplateFilterInput) {
  allAssetTemplates(where: $where) {
    id
    codeFormat
    name
  }
}

query GetPaginatedAssetTemplates(
  $after: String
  $before: String
  $first: Int
  $last: Int
  $where: AssetTemplateFilterInput
  $order: [AssetTemplateSortInput!]
){
  assetTemplates(
    after: $after
    before: $before
    first: $first
    last: $last
    where: $where
    order:$order
  ){
      pageInfo {
      hasNextPage
      hasPreviousPage
      startCursor
      endCursor
    }
    totalCount
     nodes{
      id
      name
      codeFormat
      syncTargets{
        name
      }
      assetTemplateCounters{
        id
        groupId
        key
        name
        dataType
        incrementType
        active
      }
      templateProperties{
        id
        name
        dataType
        isMandatory
        active
        sequence
        viewerGroupIds
        updaterGroupIds
      }
      category
      hierarchy
      location
      notifyChanges
      parentAssetRequired
      permittedHours
      reviewAttributes
      shiftHours
      syncAssetToCMMS
      syncProjectToCMMS
      syncResouceToCMMS
      telematics
    }
  }

}

query GetAssetTemplateById($id: String!) {
  assetTemplateById(id: $id) {
    id
    name
    category
    shiftHours
    permittedHours
    templateProperties{
      id
      name
      dataType
      isMandatory
      active
      sequence
    }
    syncTargets{
      name
    }
  }
}