query assetbycode($assetCode: String!){
  searchAssetByCode(assetCode: $assetCode){
      syncTarget{
      name
    }
    category
    assetTemplate
    assetType
    parentAssetCodes
    hasSubAssets
    codaAnalysisCode
    assetHierarchyId
    displayName
    needsReview
    lastReviewed
    lastReviewedBy
    lastAudited
    lastAuditedBy
    lastStatutoryInspectionDate
    statutoryInspectionIntervalMonths
    markerColour
    id
    active
    approved
    parentAssetId
    code
    name
    make
    model
    serialNumber
    depotNo
    functionalLocationCode
    transferToDepotNo
    transferToDepotNoEffectiveFrom
    transferToDepotNoAssetApprovalId
    latitude
    longitude
    templateId
    dateOfAcquisition
    dateOfDisposal
    farLeasedExpensed
    yearOfManufacture
    condition
    status
    disposalStatus
    disposalEffectiveFrom
    disposalApprovalId
    statutoryInspection
    salesInvoiceNo
    shiftHours
    {
      key
      value{
        start
        end
      }
    }
    permittedHours
    {
      key
      value{
        start
        end
      }
    }
    assetCounters
    {
        assetTemplateCounterId
        name
        valueTimestamp
        value
    }
    assetImages
    {
        id
        filename
        url
        comments
    }
    assetProperties
    {
      templatePropertyId
      sequence
      viewerGroupIds
      updaterGroupIds
      propertyValue
      propertyValueNumber
      userCanView
      userCanUpdate
      id
      name
      dataType
      isMandatory
      active
      sequence
    
    }
}
}