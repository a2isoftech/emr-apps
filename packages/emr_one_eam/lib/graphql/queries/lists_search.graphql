query getLists(
  $after: String
  $before: String
  $first: Int
  $last: Int
  $where: AssetManagementListSearchResultFilterInput
  $order: [AssetManagementListSearchResultSortInput!]
) {
  lists(
    after: $after
    before: $before
    first: $first
    last: $last
    where: $where
    order:$order
  ) {
    pageInfo {
      hasNextPage
      hasPreviousPage
      startCursor
      endCursor
    }
    totalCount
    nodes {
      id
      listName
      active
      isUsedByAssetTemplates
      listValue {
        active
        text
        value
        orderIndex
      }
    }
  }
}